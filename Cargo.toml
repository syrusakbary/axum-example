[package]
name = "wasix-axum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "=0.8.1", features = ["tokio", "json"] }
axum-server = "=0.7.1"
serde = { version = "1.0.160", features = ["derive"] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.16", features = ["fmt"] }

tokio = { version = "=1.35.1", default-features = false, features = ["full"] }
